name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack data
        run: python scripts/pack_data.py
      - name: Upload data pack to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mhcore-data-*.tar.gz
            dist/mhcore-data-*.tar.gz.sha256

  pypi:
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
