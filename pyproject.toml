[project]
name = "makehuman-mcp"
version = "0.1.1"
description = "GUI-free MakeHuman core + MCP server: build, save and export 3D human characters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "vidya-hub" }]
keywords = ["makehuman", "3d", "character", "mcp", "headless", "obj", "fbx"]
dependencies = [
    "numpy>=1.17.4",
    "mcp[cli]>=1.2.0,<2.0",
]

[project.scripts]
makehuman-mcp = "makehuman_mcp.server:main"

[project.urls]
Homepage = "https://github.com/vidya-hub/makehuman-core"
Upstream = "http://www.makehumancommunity.org/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/data",
    "/out",
    "/.venv",
    "/mcp-server/.venv",
]

[tool.hatch.build.targets.wheel]
packages = ["mhcore", "makehuman_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"_vendor" = "mhcore/_vendor"

[tool.pytest.ini_options]
testpaths = ["tests"]
