[project]
name = "makehuman-mcp"
version = "0.1.0"
description = "MCP server that builds MakeHuman characters via mhcore (in-process) or a running GUI socket"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2.0",
]

[project.scripts]
makehuman-mcp = "makehuman_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["makehuman_mcp"]
